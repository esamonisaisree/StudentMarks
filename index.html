
<!DOCTYPE html>
<html>
<body>
<h2>Student Marks</h2>

Subject 1: <input id="m1"><br><br>
Subject 2: <input id="m2"><br><br>
Subject 3: <input id="m3"><br><br>

<button onclick="calculate()">Calculate</button>
<p id="result"></p>

<script>
function calculate() {
 let a = Number(document.getElementById("m1").value);
 let b = Number(document.getElementById("m2").value);
 let c = Number(document.getElementById("m3").value);

 let total = a + b + c;
 let avg = total / 3;

 document.getElementById("result").innerHTML =
 "Total = " + total + "<br>Average = " + avg;
}
</script>
</body>
</html>
